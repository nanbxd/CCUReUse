<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/logos/logo.png" />
    <meta name="theme-color" content="#1d1713" />
    <script>try{for(const name of ['token','user','theme']){const old='curu_'+name,next='caspianhub_'+name;if(!localStorage.getItem(next)&&localStorage.getItem(old))localStorage.setItem(next,localStorage.getItem(old));localStorage.removeItem(old)}document.documentElement.dataset.theme=localStorage.getItem('caspianhub_theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
    <meta name="description" content="CaspianHub — единый портал сообщества Caspian. Афиша мероприятий, билеты, продажа и бесплатная передача вещей в маркете." />
    <title>CaspianHub — портал сообщества Caspian</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
