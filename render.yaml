services:
  - type: web
    name: curu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curu-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: curu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: curu-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: curu-db
          property: port
      - key: DB_HOST
        fromDatabase:
          name: curu-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: curu-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAIL
        value: demo@curu.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SUPPORT_CHAT_ID
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false

databases:
  - name: curu-db
    plan: free
    databaseName: curu
    user: curu
