services:
  - type: web
    name: curu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPPORT_CHAT_ID
        sync: false

databases:
  - name: curu-db
    plan: free
    databaseName: curu
    user: curu
